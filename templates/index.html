<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Web</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Apply the saved theme before the page paints, so it doesn't flash light first.
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    </script>
</head>
<body>
    <main>
        <header class="page-header">
            <h1>ASCII ART WEB</h1>
            <button id="theme-toggle" class="secondary-button" type="button">🌙 Dark Mode</button>
        </header>

        <form action="/ascii-art" method="POST">
            <label for="text">Text</label>
            <textarea id="text" name="text" placeholder="Type something..." required>{{.Text}}</textarea>
            <p class="char-count"><span id="char-count">0</span> characters</p>

            <span>Font</span>

            <div class="banners">
                <input type="radio" id="standard" name="banner" value="standard"
                       {{if or (eq .Banner "standard") (eq .Banner "")}}checked{{end}}>
                <label for="standard">standard</label>

                <input type="radio" id="shadow" name="banner" value="shadow"
                       {{if eq .Banner "shadow"}}checked{{end}}>
                <label for="shadow">shadow</label>

                <input type="radio" id="thinkertoy" name="banner" value="thinkertoy"
                       {{if eq .Banner "thinkertoy"}}checked{{end}}>
                <label for="thinkertoy">thinkertoy</label>
            </div>

            <button type="submit">Generate art</button>
        </form>

        <!-- ASCII art screen -->
        <section class="screen">
            <div class="screen-toolbar">
                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
                <button id="copy-btn" class="secondary-button" type="button">Copy Art</button>
            </div>
            <pre>{{.Art}}</pre>
        </section>
    </main>

    <script>
        const form = document.querySelector('form');
        const textarea = document.getElementById('text');
        const preOutput = document.querySelector('pre');
        const radios = document.querySelectorAll('input[name="banner"]');
        const charCountSpan = document.getElementById('char-count');
        const copyBtn = document.getElementById('copy-btn');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const feedback = document.getElementById('feedback');

        // Feedback message above the art: type is "error" or "" (neutral)
        function showFeedback(message, type) {
            feedback.textContent = message;
            feedback.className = 'feedback' + (type ? ' feedback-' + type : '');
        }

        function updateCopyButton() {
            copyBtn.disabled = preOutput.textContent.trim() === '';
        }

        // Character counter
        function updateCharCount() {
            charCountSpan.textContent = textarea.value.length;
        }

        // Live art generation via fetch
        let latestRequest = 0;

        function updateArt() {
            if (textarea.value === '') {
                preOutput.textContent = '';
                showFeedback('Type some text to see your art.', '');
                updateCopyButton();
                return;
            }

            // Only the newest request may update the page, so slow answers can't overwrite fresh ones.
            const requestId = ++latestRequest;

            fetch('/ascii-art', {
                method: 'POST',
                body: new URLSearchParams(new FormData(form))
            })
            .then(response => response.text().then(html => ({ ok: response.ok, status: response.status, html })))
            .then(({ ok, status, html }) => {
                if (requestId !== latestRequest) return;

                const doc = new DOMParser().parseFromString(html, 'text/html');

                if (!ok) {
                    // The server sent its error page: show its title and hint here instead.
                    const title = doc.querySelector('h1');
                    const hint = doc.querySelector('.error-hint');
                    const message = (title ? title.textContent : 'Error') +
                        ' (' + status + ')' + (hint ? ': ' + hint.textContent : '');
                    preOutput.textContent = '';
                    showFeedback(message, 'error');
                    updateCopyButton();
                    return;
                }

                const newPre = doc.querySelector('pre');
                preOutput.textContent = newPre ? newPre.textContent : '';
                showFeedback('', '');
                updateCopyButton();
            })
            .catch(() => {
                if (requestId !== latestRequest) return;
                showFeedback('Could not reach the server. Is it still running?', 'error');
            });
        }

        textarea.addEventListener('input', () => {
            updateCharCount();
            updateArt();
        });
        radios.forEach(radio => radio.addEventListener('change', updateArt));

        // Copy button
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(preOutput.textContent)
                .then(() => {
                    copyBtn.textContent = 'Copied! ✨';
                    setTimeout(() => { copyBtn.textContent = 'Copy Art'; }, 2000);
                })
                .catch(() => showFeedback('Could not copy. Select the art and copy it by hand.', 'error'));
        });

        // Dark / light mode toggle (remembered across page loads)
        function setThemeLabel() {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            themeToggleBtn.textContent = dark ? '☀️ Light Mode' : '🌙 Dark Mode';
        }

        themeToggleBtn.addEventListener('click', () => {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (dark) {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch (e) {}
            setThemeLabel();
        });

        updateCharCount();
        updateCopyButton();
        setThemeLabel();
    </script>
</body>
</html>
